<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <!-- Faint grid -->
  <line x1="0" y1="75" x2="400" y2="75" stroke="white" stroke-opacity="0.03" stroke-width="0.5"/>
  <line x1="0" y1="150" x2="400" y2="150" stroke="white" stroke-opacity="0.03" stroke-width="0.5"/>
  <line x1="0" y1="225" x2="400" y2="225" stroke="white" stroke-opacity="0.03" stroke-width="0.5"/>
  
  <!-- Candlestick wicks (thin vertical lines) -->
  <!-- Candle 1 - bullish (going up) -->
  <line x1="40" y1="200" x2="40" y2="100" stroke="white" stroke-opacity="0.025" stroke-width="1"/>
  <rect x="35" y="130" width="10" height="40" fill="white" fill-opacity="0.02" rx="1"/>
  
  <!-- Candle 2 - bearish -->
  <line x1="80" y1="230" x2="80" y2="120" stroke="white" stroke-opacity="0.025" stroke-width="1"/>
  <rect x="75" y="140" width="10" height="50" fill="white" fill-opacity="0.015" rx="1"/>
  
  <!-- Candle 3 - bullish -->
  <line x1="120" y1="210" x2="120" y2="80" stroke="white" stroke-opacity="0.025" stroke-width="1"/>
  <rect x="115" y="100" width="10" height="60" fill="white" fill-opacity="0.02" rx="1"/>
  
  <!-- Candle 4 - bearish small -->
  <line x1="160" y1="180" x2="160" y2="90" stroke="white" stroke-opacity="0.025" stroke-width="1"/>
  <rect x="155" y="110" width="10" height="30" fill="white" fill-opacity="0.015" rx="1"/>
  
  <!-- Candle 5 - bullish big -->
  <line x1="200" y1="250" x2="200" y2="60" stroke="white" stroke-opacity="0.025" stroke-width="1"/>
  <rect x="195" y="80" width="10" height="80" fill="white" fill-opacity="0.02" rx="1"/>
  
  <!-- Candle 6 -->
  <line x1="240" y1="220" x2="240" y2="110" stroke="white" stroke-opacity="0.025" stroke-width="1"/>
  <rect x="235" y="130" width="10" height="45" fill="white" fill-opacity="0.015" rx="1"/>
  
  <!-- Candle 7 -->
  <line x1="280" y1="190" x2="280" y2="70" stroke="white" stroke-opacity="0.025" stroke-width="1"/>
  <rect x="275" y="90" width="10" height="55" fill="white" fill-opacity="0.02" rx="1"/>
  
  <!-- Candle 8 -->
  <line x1="320" y1="240" x2="320" y2="130" stroke="white" stroke-opacity="0.025" stroke-width="1"/>
  <rect x="315" y="150" width="10" height="40" fill="white" fill-opacity="0.015" rx="1"/>
  
  <!-- Candle 9 -->
  <line x1="360" y1="200" x2="360" y2="95" stroke="white" stroke-opacity="0.025" stroke-width="1"/>
  <rect x="355" y="115" width="10" height="50" fill="white" fill-opacity="0.02" rx="1"/>
  
  <!-- Faint trend line -->
  <polyline points="40,160 80,170 120,130 160,125 200,140 240,155 280,120 320,170 360,140" 
    fill="none" stroke="white" stroke-opacity="0.02" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>